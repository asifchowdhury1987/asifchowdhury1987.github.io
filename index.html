<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Project Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 28px;
            border-bottom: 2px solid #eaeded;
            padding-bottom: 10px;
        }
        .project-section {
            margin-bottom: 40px;
        }
        .project-section h2 {
            font-size: 20px;
            color: #34495e;
            margin-bottom: 15px;
        }
        .image-box {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: block;
            margin: 0 auto;
        }
        .card-view {
            max-width: 400px; /* কার্ড সাইজের জন্য লিমিট */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Project Showcase: TaskFlow</h1>

        <!-- ১. প্রজেক্ট কার্ড প্রিভিউ সেকশন -->
        <div class="project-section">
            <h2>1. Grid / Card View Preview</h2>
            <div class="image-box card-view">
                <!-- সঠিক রেনেম করা কার্ড ইমেজ -->
                <img src="taskflow-card.png" alt="TaskFlow Card Preview">
            </div>
        </div>

        <!-- ২. ফুল স্ক্রিনশট প্রিভিউ সেকশন -->
        <div class="project-section">
            <h2>2. Full Landing Page Preview</h2>
            <div class="image-box">
                <!-- সঠিক রেনেম করা ফুল ইমেজ -->
                <img src="taskflow-full.png" alt="TaskFlow Full Page Preview">
            </div>
        </div>
    </div>

</body>
</html>
